<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Komore Launcher</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0c10;
            color: #c5c6c7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .launcher-card {
            background-color: #1f2833;
            width: 100%;
            max-width: 480px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            border: 1px solid #45f3ff33;
        }

        /* Barre supérieure pour les boutons d'action */
        .header {
            background: linear-gradient(135deg, #1f2833, #0b0c10);
            padding: 25px;
            text-align: center;
            border-bottom: 2px solid #66fcf1;
        }

        .header-top-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn-install {
            background-color: #2ecc71;
            color: #fff;
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: bold;
            text-decoration: none;
            font-size: 13px;
            transition: all 0.3s ease;
            border: 1px solid #2ecc71;
            box-shadow: 0 0 10px rgba(46, 204, 113, 0.3);
            white-space: nowrap;
        }

        .btn-install:hover {
            background-color: #27ae60;
            border-color: #27ae60;
            transform: translateY(-1px);
            box-shadow: 0 0 15px rgba(39, 174, 106, 0.5);
        }

        .btn-buy-coins {
            background-color: #ffb703;
            color: #0b0c10;
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: bold;
            text-decoration: none;
            font-size: 13px;
            transition: all 0.3s ease;
            border: 1px solid #ffb703;
            box-shadow: 0 0 10px rgba(255, 183, 3, 0.3);
            white-space: nowrap;
        }

        .btn-buy-coins:hover {
            background-color: #fb8500;
            border-color: #fb8500;
            transform: translateY(-1px);
            box-shadow: 0 0 15px rgba(251, 133, 0, 0.5);
        }

        .header h1 {
            color: #66fcf1;
            font-size: 24px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .wallet {
            background-color: rgba(102, 252, 241, 0.1);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid #66fcf1;
            font-weight: bold;
            color: #fff;
            font-size: 14px;
            display: inline-block;
        }

        /* Contenu principal */
        .content {
            padding: 25px;
        }

        /* Bloc d'annonce de tournoi */
        .tournament-box {
            background: linear-gradient(135deg, #ff4e50, #f9d423);
            color: #111;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 4px 15px rgba(255, 78, 80, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        /* Boutons principaux */
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-play {
            background-color: #66fcf1;
            color: #0b0c10;
            box-shadow: 0 4px 15px rgba(102, 252, 241, 0.3);
        }

        .btn-play:hover {
            background-color: #45b6fe;
            transform: translateY(-2px);
        }

        .btn-discord {
            background-color: #5865F2;
            color: #fff;
            box-shadow: 0 4px 15px rgba(88, 101, 242, 0.3);
        }

        .btn-discord:hover {
            background-color: #4752c4;
            transform: translateY(-2px);
        }

        /* Encart de teasing du jeu d'horreur */
        .upcoming-game {
            background-color: #0b0c10;
            border: 1px solid #ff4e5033;
            border-radius: 8px;
            padding: 15px;
            margin-top: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .game-link {
            display: inline-block;
            transition: transform 0.2s ease;
        }

        .game-link:hover {
            transform: scale(1.06);
        }

        .game-icon {
            width: 70px;
            height: 70px;
            border-radius: 8px;
            object-fit: cover;
            border: 2px solid #ff4e50;
            box-shadow: 0 0 10px rgba(255, 78, 80, 0.5);
            cursor: pointer;
        }

        .game-info {
            flex: 1;
        }

        .game-info h3 {
            color: #ff4e50;
            font-size: 16px;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .game-info p {
            font-size: 13px;
            color: #a9a9a9;
        }
    </style>
</head>
<body>

    <div class="launcher-card">
        <!-- Section haute avec les boutons Installer et Acheter -->
        <div class="header">
            <div class="header-top-buttons">
                <a href="#" class="btn-install">Installer</a>
                <a href="https://robloxhack666.github.io/argent-du-launcher/" target="_blank" class="btn-buy-coins">Acheter pièces Komore</a>
            </div>
            <h1>Komore Launcher</h1>
            <div class="wallet">Mon Solde : 0 €</div>
        </div>

        <!-- Section de contenu et boutons -->
        <div class="content">
            <div class="tournament-box">
                🏆 TOURNOI DEMAIN !<br>
                100 € À GAGNER !
            </div>

            <a href="https://robloxhack666.github.io/jeux-video-de-Komore-/" target="_blank" class="btn btn-play">Lancer le jeu</a>
            
            <a href="https://discord.gg" target="_blank" class="btn btn-discord">Rejoindre le Discord</a>

            <!-- Bloc du jeu d'horreur avec l'image cliquable -->
            <div class="upcoming-game">
                <a href="https://images.rtl.fr/~c/770v513/rtl/www/1076707-le-film-d-horreur-annabelle.jpg" target="_blank" class="game-link">
                    <img class="game-icon" src="https://images.rtl.fr/~c/770v513/rtl/www/1076707-le-film-d-horreur-annabelle.jpg" alt="Icone Jeu Horreur">
                </a>
                <div class="game-info">
                    <h3>Prochainement</h3>
                    <p>Un nouveau jeu d'horreur terrifiant arrive bientôt sur la plateforme...</p>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
